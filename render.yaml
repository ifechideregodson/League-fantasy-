services:
  - type: web
    name: aster-research-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: RESEARCH_API_TOKEN
        sync: false
      - key: RESEARCH_API_URL
        fromService:
          type: web
          name: aster-research-api
          property: hostport
  - type: web
    name: aster-research-api
    runtime: python
    plan: free
    rootDir: services/research-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RESEARCH_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TAVILY_API_KEY
        sync: false
      - key: STORM_MODEL
        value: openai/gpt-4o-mini
      - key: OPENALEX_EMAIL
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
