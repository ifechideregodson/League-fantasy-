services:
  - type: web
    name: aster-research-api
    runtime: python
    plan: free
    rootDir: services/research-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RESEARCH_API_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STORM_MODEL
        value: openai/gpt-4o-mini
